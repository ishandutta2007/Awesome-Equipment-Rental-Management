<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="220" viewBox="0 0 900 220"><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".4"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.3}50%{transform:scale(1.08);opacity:.7}}@keyframes float1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes float2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}.bg-rect{fill:url(#bg)}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:34px;fill:url(#textGrad)}.subtitle{font-weight:400;font-size:16px;fill:#94a3b8}.badge-text{font-weight:600;font-size:12px;fill:#e2e8f0}.orb1{animation:pulse 6s infinite ease-in-out;transform-origin:150px 110px}.orb2{animation:pulse 8s infinite ease-in-out 2s;transform-origin:750px 110px}.card1,.card2{animation:float1 4s infinite ease-in-out;opacity:.25}.card2{animation:float2 5s infinite ease-in-out 1s}</style><rect width="900" height="220" class="bg-rect" rx="12"/><circle cx="150" cy="110" r="140" fill="url(#glow)" class="orb1"/><circle cx="750" cy="110" r="140" fill="url(#glow)" class="orb2"/><g class="card1"><rect width="140" height="70" x="50" y="30" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><circle cx="75" cy="55" r="12" fill="#38bdf8" opacity=".5"/><rect width="70" height="6" x="95" y="48" fill="#64748b" rx="3"/><rect width="45" height="5" x="95" y="60" fill="#475569" rx="2"/></g><g class="card2"><rect width="140" height="70" x="710" y="120" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><circle cx="735" cy="145" r="12" fill="#a855f7" opacity=".5"/><rect width="70" height="6" x="755" y="138" fill="#64748b" rx="3"/><rect width="45" height="5" x="755" y="150" fill="#475569" rx="2"/></g><path stroke="#334155" stroke-width=".5" d="M0 50 H900 M0 110 H900 M0 170 H900" opacity=".2"/><path stroke="#334155" stroke-width=".5" d="M200 0 V220 M450 0 V220 M700 0 V220" opacity=".2"/><g text-anchor="middle" transform="translate(450, 95)"><rect width="220" height="26" x="-110" y="-55" fill="#1e293b" stroke="#6366f1" stroke-width="1" rx="13"/><text x="0" y="-38" class="badge-text" text-anchor="middle">⚙️ EQUIPMENT RENTAL ECOSYSTEM 🏗️</text><text x="0" y="12" class="title" text-anchor="middle">Awesome Equipment Rental Management</text><text x="0" y="42" class="subtitle" text-anchor="middle">Curated List of SaaS Platforms &amp; Open-Source Projects for Rental Fleet Operations</text></g></svg>