<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <style>
    .bg-rect { fill: url(#bg); }
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 34px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 16px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #e2e8f0; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.7; }
      100% { transform: scale(1); opacity: 0.3; }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }
    .orb1 { animation: pulse 6s infinite ease-in-out; transform-origin: 150px 110px; }
    .orb2 { animation: pulse 8s infinite ease-in-out 2s; transform-origin: 750px 110px; }
    .card1 { animation: float1 4s infinite ease-in-out; opacity: 0.25; }
    .card2 { animation: float2 5s infinite ease-in-out 1s; opacity: 0.25; }
  </style>

  <!-- Background -->
  <rect class="bg-rect" width="900" height="220" rx="12" />

  <!-- Animated Glowing Background Orbs (Behind text) -->
  <circle class="orb1" cx="150" cy="110" r="140" fill="url(#glow)" />
  <circle class="orb2" cx="750" cy="110" r="140" fill="url(#glow)" />

  <!-- Dynamic background decorative cards (Behind foreground text) -->
  <g class="card1">
    <rect x="50" y="30" width="140" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="75" cy="55" r="12" fill="#38bdf8" opacity="0.5" />
    <rect x="95" y="48" width="70" height="6" rx="3" fill="#64748b" />
    <rect x="95" y="60" width="45" height="5" rx="2" fill="#475569" />
  </g>

  <g class="card2">
    <rect x="710" y="120" width="140" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="735" cy="145" r="12" fill="#a855f7" opacity="0.5" />
    <rect x="755" y="138" width="70" height="6" rx="3" fill="#64748b" />
    <rect x="755" y="150" width="45" height="5" rx="2" fill="#475569" />
  </g>

  <!-- Grid accent lines -->
  <path d="M0 50 H900 M0 110 H900 M0 170 H900" stroke="#334155" stroke-width="0.5" opacity="0.2" />
  <path d="M200 0 V220 M450 0 V220 M700 0 V220" stroke="#334155" stroke-width="0.5" opacity="0.2" />

  <!-- FOREGROUND CONTENT (Guaranteed high visibility) -->
  <g transform="translate(450, 95)" text-anchor="middle">
    <!-- Icon / Tag -->
    <rect x="-110" y="-55" width="220" height="26" rx="13" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
    <text x="0" y="-38" class="badge-text" text-anchor="middle">⚙️ EQUIPMENT RENTAL ECOSYSTEM 🏗️</text>

    <!-- Main Title -->
    <text x="0" y="12" class="title" text-anchor="middle">Awesome Equipment Rental Management</text>
    
    <!-- Subtitle -->
    <text x="0" y="42" class="subtitle" text-anchor="middle">Curated List of SaaS Platforms &amp; Open-Source Projects for Rental Fleet Operations</text>
  </g>
</svg>
